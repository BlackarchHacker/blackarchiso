# See https://wiki.hypr.land/Configuring/Keywords/

bindd = SUPER SHIFT, A, ChatGPT, exec, blackarch-launch-or-focus-webapp ChatGPT "https://chatgpt.com"
bindd = SUPER ALT, A, Grok, exec, blackarch-launch-or-focus-webapp GROK "https://grok.com"

bindd = SUPER, B, Browser, exec, blackarch-launch-or-focus qutebrowser qutebrowser
bindd = SUPER SHIFT, B, Bittentechsolutions, exec, blackarch-launch-or-focus-webapp bittentechsolutions "https://portal.bittentechsolutions.in/"
bindd = SUPER alt, B,Open Librewolf browser, exec, blackarch-launch-or-focus "microsoft-edge" microsoft-edge-stable
bindd = SUPER Control alt, B,Open brave browser, exec, brave
bindd = SUPER SHIFT ALT, B, Browser (private), exec, blackarch-launch-browser --private
bindd = SUPER CTRL, B, Show battery remaining, exec, notify-send "󰁹    Battery is at $( blackarch-battery-remaining)%"

bindd = SUPER, C, Universal copy, sendshortcut, CTRL, Insert,
bindd = SUPER SHIFT, C, Calendar, exec, blackarch-launch-or-focus-webapp "Zoho Calendar" "https://mail.zoho.in/zm/#calendar/wk"

bindd = SUPER SHIFT, D, Open Discord, exec, blackarch-launch-or-focus-webapp Discord "https://discord.com/login"
# bindd = SUPER SHIFT, D, Docker, exec, blackarch-launch-or-focus-tui lazydocker lazydocker

bindd = SUPER, E, Toggle workspace background, togglespecialworkspace, background
bindd = SUPER Shift, E,Move to workspace background, movetoworkspace, special:background
bindd = SUPER ALT, E, Move to workspace background silently, movetoworkspacesilent, special:background
bindd = SUPER Control, E,Zoho Email, exec, blackarch-launch-or-focus-webapp "Zoho Mail" "https://mail.zoho.in/zm/"
bindd = SUPER CTRL, E, Emoji picker, exec,  blackarch-launch-walker -m symbols

bindd = SUPER, F, Full screen, fullscreen, 0
bindd = SUPER CTRL, F, Tiled full screen, exec, hyprctl dispatch fullscreenstate toggle #fullscreenstate, 0 2
bindd = SUPER ALT, F, Full width, fullscreen, 1
bindd = SUPER SHIFT, F, File manager, exec, blackarch-launch-or-focus thunar "uwsm-app -- thunar"

bindd = SUPER, G, Toggle window grouping, togglegroup
bindd = SUPER ALT, G, Move active window out of group, moveoutofgroup
bindd = SUPER SHIFT CTRL, G, Google Messages, exec, blackarch-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"


bindd = SUPER ALT, H, hackthebox Academy, exec, blackarch-launch-or-focus-webapp "Academy.hackthebox" "https://academy.hackthebox.com/dashboard"
bindd = SUPER SHIFT, H, hackthebox Lab, exec, blackarch-launch-or-focus-webapp "app.hackthebox" "https://app.hackthebox.com/home"

bindd = SUPER , I, Audio launcher pulsemixer, exec, blackarch-launch-or-focus-tui pulsemixer
bindd = SUPER CTRL, I, Toggle locking on idle, exec,  blackarch-toggle-idle
bindd = SUPER ALT, I, Toggle locking on idle, exec, hyprctl dispatch tagwindow +noidle &> /dev/null
bindd = SUPER SHIFT, I, Wifi launcher impala, exec, blackarch-launch-or-focus blackarch-launch-wifi#blackarch-launch-tui impala
bindd = SUPER SHIFT ALT, I, Bluetooth launcher bluetui, exec, blackarch-launch-or-focus blackarch-launch-bluetooth

bindd = SUPER, J, Toggle window split, exec, hyprctl dispatch togglesplit, # dwindle

bindd = SUPER, K, Show key bindings, exec,  blackarch-menu-keybindings

binddel = SUPER, L,Screen Lock, exec, hyprlock
binddel = SUPER, L,Change Brighness after screen lock, exec, brightnessctl -e4 -n2 set 1 && brightnessctl --device='samsung-galaxybook::kbd_backlight' set 0
binddel = SUPER Control, L,Set Screen Brightness to 70%, exec, brightnessctl -e4 -n2 set 70% && brightnessctl --device='samsung-galaxybook::kbd_backlight' set 3
binddel = SUPER Control ALT, L,Set Screen Brightness to 70%, exec, brightnessctl -e4 -n0 set 0% && brightnessctl --device='samsung-galaxybook::kbd_backlight' set 0
binddel = SUPER ALT, L,Set Screen Brightness to minimum, exec, brightnessctl -e4 -n2 set 1% && brightnessctl --device='samsung-galaxybook::kbd_backlight' set 0
binddel = SUPER Control Shift, L,Reset user after lock,exec, sudo faillock --user $USER --reset
binddel = SUPER Shift, L,Session Restore if hyprlock is killed, exec, hyprctl --instance 0 "keyword misc:allow_session_lock_restore 1" && hyprctl --instance 0 "dispatch exec hyprlock"
binddel = , switch:Lid Switch,Laptop lid closure executes hyprlock, exec,  hyprlock
binddel = , switch:Lid Switch off,Laptop lid closure executes hyprlock, exec,  hyprlock

bindd = SUPER Control, M, Metasploitable2, exec, blackarch-launch-or-focus-webapp metasploitable "https://docs.rapid7.com/metasploit/metasploitable-2/"
bindd = SUPER SHIFT, M, Music Player MPV, exec, blackarch-launch-or-focus kitty mpv $HOME/Music/MP3/

bindd = SUPER SHIFT, N, Launch Editor, exec, blackarch-launch-editor
bindd = SUPER CTRL, N, Toggle nightlight, exec,  blackarch-toggle-nightlight

bindd = SUPER Control, O, Obsidian, exec, blackarch-launch-or-focus ^obsidian$ "uwsm-app -- obsidian -disable-gpu --enable-wayland-ime"

bindd = SUPER, P, Pop window out (float & pin), exec, blackarch-hyprland-window-pop
bindd = SUPER alt, P, Pseudo window, exec, hyprctl dispatch pseudo, # dwindle
bindd = SUPER SHIFT, P, Google Photos, exec, blackarch-launch-or-focus-webapp "Google Photos" "https://photos.google.com/"

bindd = SUPER, Q, Terminal kitty, exec,blackarch-launch-or-focus kitty || kitty

bindd = SUPER, S, Toggle scratchpad, togglespecialworkspace, scratchpad
bindd = SUPER ALT, S, Move window to scratchpad, movetoworkspacesilent, special:scratchpad
bindd = SUPER CTRL, S,File Share, exec,  blackarch-menu share

bindd = SUPER, T, Toggle window floating/tiling, exec, hyprctl dispatch togglefloating
bindd = SUPER SHIFT, T, Activity, exec, blackarch-launch-or-focus-tui btop btop
bindd = SUPER CTRL, T, Show time, exec, notify-send "    $(date +"%A %H:%M  —  %d %B W%V %Y")"
bindd = SUPER ALT, T, TryHackMe, exec, blackarch-launch-or-focus-webapp "TryHackMe" "https://tryhackme.com/hacktivities?tab=paths"

bindd = SUPER, U, Browser, exec, blackarch-launch-or-focus ulaa-browser ulaa-browser-stable

bindd = SUPER, V, Universal paste, sendshortcut, SHIFT, Insert,
bindd = SUPER CTRL, V, Clipboard manager, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy && hyprctl dispatch sendshortcut SHIFT,Insert,active

bindd = SUPER, W, Close window, killactive,
bindd = SUPER SHIFT, W, WhatsApp, exec, blackarch-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"

bindd = SUPER, X, Universal cut, sendshortcut, CTRL, X,

bindd = SUPER SHIFT, Y, YouTube, exec, blackarch-launch-or-focus-webapp Youtube "https://youtube.com/"

bindd = SUPER, RETURN, Terminal kitty, exec,blackarch-launch-or-focus kitty 
# uwsm-app -- kitty

bindd = SUPER, BACKSPACE, Toggle window transparency, exec, hyprctl dispatch setprop "address:$(hyprctl activewindow -j | jq -r '.address')" opaque toggle
bindd = SUPER SHIFT, BACKSPACE, Toggle workspace gaps, exec,  blackarch-hyprland-workspace-toggle-gaps

bindd = SUPER, SPACE, Launch apps, exec,  rofi -show drun
bindd = SUPER ALT, SPACE, Blackarch menu, exec,  blackarch-menu
bindd = SUPER Control ALT, SPACE, Rofi show open window, exec, rofi -show window
bindd = SUPER SHIFT, SPACE, Toggle top bar, exec,  blackarch-toggle-waybar
bindd = SUPER CTRL, SPACE, Next background in theme, exec,  blackarch-theme-bg-next
bindd = SUPER SHIFT CTRL, SPACE, Theme menu, exec,  blackarch-menu theme

bindd = SUPER, ESCAPE, System menu with rofi, exec,  blackarch-menu system

# Notifications
bindd = SUPER, COMMA, Dismiss last notification, exec, dunstctl close 
bindd = SUPER SHIFT, COMMA, Dismiss all notifications, exec, dunstctl close-all 
bindd = SUPER CTRL, COMMA, Toggle silencing notifications, exec, blackarch-toggle-notification
bindd = SUPER ALT, COMMA, Invoke last notification, exec, dunstctl   history-pop  
bindd = SUPER SHIFT ALT, COMMA, Restore last notification, exec, dunstctl history-clear

# Captures
bindd = , PRINT, Screenshot with editing, exec,  blackarch-cmd-screenshot
bindd = SHIFT, PRINT, Screenshot to clipboard, exec,  blackarch-cmd-screenshot smart clipboard
bindd = ALT, PRINT, Screenrecording, exec,  blackarch-menu screenrecord
bindd = SUPER, PRINT, Color picker, exec, pkill hyprpicker || hyprpicker -a

bindd = CTRL ALT, DELETE, Close all windows, exec, blackarch-hyprland-window-close-all

