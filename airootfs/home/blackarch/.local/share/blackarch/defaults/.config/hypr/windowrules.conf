##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

 windowrule {
     # Ignore maximize requests from all apps. You'll probably like this.
     name = suppress-maximize-events
     match:class = .*

     suppress_event = maximize
 }

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

# Workspace Arrangement and decoration
windowrule = border_color rgba(33ccffee), match:class .*
windowrule = group set, match:class .*
windowrule = tag +terminal, match:class (.*Alacritty.*|.*kitty.*|.*ghostty.*|.*terminal.*|.*i3.*|.*konsole.*), workspace 1
windowrule = tag +browser, match:class (.*qutebrowser.*|.*ulaa.*|.*firefox.*|.*chromium.*|.*brave.*|.*librewolf.*), workspace 2
windowrule = tag +documents, match:class .*obsidian.*, workspace 3
windowrule = tag +fileManager, match:class .*thunar.*, workspace 4


Workspace-Rules = group only, decoration group border_color rgba(33ccffee)
# Floating windows
windowrule = float on, match:tag floating-window
windowrule = center on, match:tag floating-window
windowrule = size 875 600, match:tag floating-window
windowrule = tag +floating-window, match:class (org.blackarch.bluetui|org.blackarch.impala|org.blackarch.wiremix|org.blackarch.btop|org.blackarch.terminal|org.blackarch.bash|org.gnome.NautilusPreviewer|org.gnome.Evince|com.gabm.satty|blackarch|About|TUI.float|imv|mpv)
windowrule = tag +floating-window, match:class (xdg-desktop-portal-gtk|sublime_text|DesktopEditors|org.gnome.Nautilus), match:title ^(Open.*Files?|Open [F|f]older.*|Save.*Files?|Save.*As|Save|All Files|.*wants to [open|save].*|[C|c]hoose.*)
windowrule = float on, match:class org.gnome.Calculator

# Fullscreen screensaver
windowrule = fullscreen on, match:class org.blackarch.screensaver
windowrule = float on, match:class org.blackarch.screensaver

# No transparency on media windows
windowrule = opacity 1 1, match:class ^(zoom|vlc|mpv|org.kde.kdenlive|com.obsproject.Studio|com.github.PintaProject.Pinta|imv|org.gnome.NautilusPreviewer)$

# Popped window rounding
windowrule = rounding 8, match:tag pop

# Prevent idle while open
windowrule = idle_inhibit always, match:tag noidle

# WebcamOverlay
windowrule = float on, match:title WebcamOverlay
windowrule = pin on, match:title WebcamOverlay
windowrule = no_initial_focus on, match:title WebcamOverlay
windowrule = no_dim on, match:title WebcamOverlay
windowrule = move (monitor_w-window_w-40) (monitor_h-window_h-40), match:title WebcamOverlay

# Define terminal tag to style them uniformly
windowrule = tag +terminal, match:class (Alacritty|kitty|com.mitchellh.ghostty)

